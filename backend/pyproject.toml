[project]
name = "api-tool"
version = "0.1.0"
description = "Local API debugging tool with HTTP/MCP/LLM integration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "ruff>=0.6.0",
]
# 仅非 Windows 平台需要：Windows 字段加密走系统 DPAPI，无需本依赖。
secure = [
    "cryptography>=41.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

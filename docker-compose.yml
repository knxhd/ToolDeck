# api-tool 容器编排：一条命令构建并启动
#   docker compose up -d --build
# 访问 http://localhost:8765
services:
  api-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-tool:latest
    container_name: api-tool
    ports:
      - "8765:8765"
    volumes:
      # 持久化集合 / 历史 / 配置（后端 APP_CONFIG_DIR=/data/api-tool）
      - apitool-data:/data/api-tool
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  apitool-data:
